name: 🌾 田農大腦 - 自動編譯 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允許手動在 GitHub 網頁上觸發

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 步驟 1：下載程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步驟 2：設定 Java 17（Android 編譯需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 步驟 3：快取 Gradle 套件（加快後續編譯速度）
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 步驟 4：授予 gradlew 執行權限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 步驟 5：編譯 Debug APK（不需要 Keystore 簽名，可直接安裝）
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 步驟 6：上傳 APK 為 Artifact（可在 Actions 頁面下載）
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 田農大腦-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 步驟 7（可選）：自動建立 GitHub Release 並附上 APK
      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 田農大腦 v1.0.${{ github.run_number }}
          body: |
            ## 🌾 田農大腦・手機智慧診斷隨身版
            
            ### 安裝方式
            1. 在 Android 手機上下載 `田農大腦.apk`
            2. 開啟「設定」→「安全性」→ 允許「安裝未知來源應用程式」
            3. 點擊 APK 檔案安裝
            4. 安裝後桌面出現「田農大腦」圖示即完成！
            
            ### 本版本功能
            - 15 種屏東在地作物智慧病蟲害診斷
            - 高改場雙軌處方資料庫（有機友善 + 化學用藥/PHI）
            - 手機相機直接拍攝作物病徵
            - Groq AI 多模態影像分析
            - 田間弱網最佳化（前端壓縮至 ~100KB）
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
