name: 🌾 田農大腦 - 自動編譯 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ 用純 Python 自動生成各解析度 APP 圖示 PNG（綠色田農大腦主題）
      - name: Generate app icons with Python
        run: |
          python3 - <<'EOF'
          import os, struct, zlib

          def make_png(width, height, r, g, b):
              """生成純色方形 PNG（不需要任何外部套件）"""
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xFFFFFFFF
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              ihdr_data = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              raw_rows = b''.join(b'\x00' + bytes([r, g, b]) * width for _ in range(height))
              idat_data = zlib.compress(raw_rows)
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', ihdr_data)
                      + chunk(b'IDAT', idat_data)
                      + chunk(b'IEND', b''))

          # 各密度圖示尺寸 (px)
          densities = {
              'mipmap-mdpi':    48,
              'mipmap-hdpi':    72,
              'mipmap-xhdpi':   96,
              'mipmap-xxhdpi':  144,
              'mipmap-xxxhdpi': 192,
          }

          # 田農大腦主題：農業綠 #2E7D32
          R, G, B = 46, 125, 50

          for folder, size in densities.items():
              path = f'app/src/main/res/{folder}'
              os.makedirs(path, exist_ok=True)
              png_data = make_png(size, size, R, G, B)
              for name in ['ic_launcher.png', 'ic_launcher_round.png']:
                  with open(f'{path}/{name}', 'wb') as f:
                      f.write(png_data)
                  print(f'✅ 建立 {path}/{name} ({size}x{size}px)')

          print('🎉 所有圖示生成完成！')
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 田農大腦-APK-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 田農大腦 v1.0.${{ github.run_number }}
          body: |
            ## 🌾 田農大腦・手機智慧診斷隨身版

            ### 安裝方式
            1. 在 Android 手機上下載 `田農大腦.apk`
            2. 開啟「設定」→「安全性」→ 允許「安裝未知來源應用程式」
            3. 點擊 APK 檔案安裝
            4. 安裝後桌面出現「田農大腦」圖示即完成！

            ### 本版本功能
            - 15 種屏東在地作物智慧病蟲害診斷
            - 高改場雙軌處方資料庫（有機友善 + 化學用藥/PHI）
            - 手機相機直接拍攝作物病徵
            - Groq AI 多模態影像分析
            - 田間弱網最佳化（前端壓縮至 ~100KB）
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
